<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
      import { GUI } from "three/addons/libs/lil-gui.module.min.js";
      import gsap from "gsap";
      let innerWidth = window.innerWidth;
      let innerHeight = window.innerHeight;
      // 创建环境光
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);

      const gui = new GUI();

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.1,
        1000,
      );
      // camera.lookAt(4, 5, -2);
      const span = new THREE.PlaneGeometry(10, 10);
      const spanMaterial = new THREE.MeshStandardMaterial({
        color: "#a9c388",
        side: THREE.DoubleSide,
      });
      const spanMesh = new THREE.Mesh(span, spanMaterial);
      spanMesh.rotation.x = Math.PI / 2;
      spanMesh.position.y = 0;
      scene.add(spanMesh);

      // house
      const house = new THREE.Group();
      scene.add(house);
      // 墙壁
      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(4, 2.5, 4),
        new THREE.MeshStandardMaterial({
          color: "#ac8e82 ",
        }),
      );
      wall.position.y = 2.5 / 2 + 0.01;
      house.add(wall);
      // 屋顶
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(3.5, 1, 4),
        new THREE.MeshStandardMaterial({
          color: 0x00ff00,
        }),
      );
      roof.position.y = 2.5 + 0.5;
      roof.rotation.y = Math.PI / 4;
      house.add(roof);
      // door
      const door = new THREE.Mesh(
        new THREE.PlaneGeometry(2, 2),
        new THREE.MeshStandardMaterial({
          color: 0x00ff00,
        }),
      );
      door.position.z = 4 / 2 + 0.01;
      door.position.y = 2 / 2;
      house.add(door);
      // 灌木
      const bushGeometry = new THREE.SphereGeometry(1, 16, 16);
      const bushMaterial = new THREE.MeshStandardMaterial({
        color: "#89c854",
      });
      const num = 4;
      for (let i = 0; i < num; i++) {
        const bushMesh = new THREE.Mesh(bushGeometry, bushMaterial);
        house.add(bushMesh);
        // bushMesh.position.set = i * 2 - num / 2;
        // bushMesh.position.y = 0.5;
        switch (i) {
          case 0:
            bushMesh.scale.set(0.5, 0.5, 0.5);
            bushMesh.position.set(0.8, 0.2, 2.2);
            break;
          case 1:
            bushMesh.scale.set(0.25, 0.25, 0.25);
            bushMesh.position.set(1.4, 0.1, 2.1);
            break;
          case 2:
            bushMesh.scale.set(0.4, 0.4, 0.4);
            bushMesh.position.set(-0.8, 0.1, 2.2);
            break;
          default:
            bushMesh.scale.set(0.15, 0.15, 0.15);
            bushMesh.position.set(-1, 0.05, 2.6);
        }
      }

      camera.position.set(0, 0, 5);
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(innerWidth, innerHeight);
      // 开启阴影
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; // 开启阻尼效果
      // controls.target.y = 2; // 相机轨道控制器的目标位置 设置完之后要update
      controls.dampingFactor = 0.01;

      // 轴辅助器  3表示轴的长度
      const axisHelper = new THREE.AxesHelper(3);
      // 把轴辅助器添加到场景中
      scene.add(axisHelper);

      const timer = new THREE.Timer();
      renderer.setAnimationLoop(() => {
        controls.update();
        timer.update();

        renderer.render(scene, camera);
      });

      // 见光照添加到场景中
      scene.add(ambientLight);

      // 添加方向光
      const moonLight = new THREE.DirectionalLight("#ffffff", 1.5);
      moonLight.position.set(4, 5, -2);
      scene.add(moonLight);

      window.addEventListener("resize", () => {
        // 1. 更新宽高
        innerWidth = window.innerWidth;
        innerHeight = window.innerHeight;

        // 2. 更新相机的宽高比
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix(); // ✅ 必须调用

        // 3. 更新渲染器尺寸
        renderer.setSize(innerWidth, innerHeight);
        // requestFullscreen();
        // 4. （WebGPU 推荐）设置像素比，防止模糊
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });
      renderer.shadowMap.type = THREE.PointLightShadow; // 开启软阴影算法
      // renderer.shadowMap.autoUpdate = false; // 关闭自动更新阴影贴图
      // setTimeout(() => {
      //   renderer.shadowMap.autoUpdate = true; // 开启自动更新阴影贴图
      // }, 2000);
      gui.add(ambientLight, "intensity").min(0).max(1).step(0.1);
      gui.add(camera.position, "y").min(-5).max(5).step(0.1);
      gui.add(camera.position, "z").min(-5).max(5).step(0.1);
      gui.add(camera.position, "x").min(-5).max(5).step(0.1);
    </script>
  </body>
</html>
