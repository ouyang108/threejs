<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
      import { GUI } from "three/addons/libs/lil-gui.module.min.js";
      let innerWidth = window.innerWidth;
      let innerHeight = window.innerHeight;
      const gui = new GUI();

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.1,
        1000,
      );

      camera.position.set(0, 0, 5);
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);

      // 设置光源
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); // 环境光，颜色为白色，强度为0.5
      // scene.add(ambientLight);
      // 点光
      const pointLight = new THREE.PointLight(0xffffff, 1); // 点光，颜色为白色，强度为1
      pointLight.position.set(2, 3, 4); // 设置点光的位置
      scene.add(pointLight);

      const hemisphereLight = new THREE.HemisphereLight(
        0xff0000,
        0x0000ff,
        0.5,
      ); // 半球光，天空颜色为红色，地面颜色为蓝色，强度为0.5
      scene.add(hemisphereLight);
      // 方向灯
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5); // 方向光，颜色为白色，强度为0.5
      directionalLight.position.set(0, 1, 0); // 设置方向光的位置
      // 矩形灯 只能对MeshStandardMaterial和MeshPhysicalMaterial材质产生影响
      const rectAreaLight = new THREE.RectAreaLight(0xff9999, 1, 2, 2); // 矩形灯，颜色为白色，强度为1，宽度为2，高度为2
      rectAreaLight.position.set(0, 0, 2); // 设置矩形灯的位置
      scene.add(rectAreaLight);
      // 聚光灯 类似手电筒，光线从一个点发出，在一个圆锥体内逐渐变弱，直到达到一个指定的距离后完全消失。聚光灯可以设置一个目标点，光线会始终指向这个目标点。
      const spotLight = new THREE.SpotLight(0xffffff, 1); // 聚 光灯，颜色为白色，强度为1
      spotLight.position.set(0, 5, 0); // 设置聚光灯的位置
      scene.add(spotLight);
      scene.add(spotLight.target); // 把聚光灯的目标添加到场景中
      spotLight.target.position.set(0, 0, 0); // 设置聚光灯的目标位置  如果你不把 target 放入场景，你就无法通过改变坐标来控制手电筒指向哪里 这个“方向”，是由聚光灯的 target（目标点） 决定的

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; // 开启阻尼效果
      // controls.target.y = 2; // 相机轨道控制器的目标位置 设置完之后要update
      controls.dampingFactor = 0.01;

      // 材质
      const material = new THREE.MeshStandardMaterial({
        roughness: 0.4, // 粗糙度，范围从 0 到 1，值越高表示材质表面越粗糙
      });

      // 对光源有反应的材质
      const newGemothree = new THREE.Mesh(
        new THREE.SphereGeometry(1, 16, 16),
        material,
      );
      const cube = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), material);
      cube.position;
      cube.position.x = -2;
      scene.add(cube);
      const torus = new THREE.Mesh(
        new THREE.TorusGeometry(0.5, 0.2, 16, 100),
        material,
      );
      torus.position.x = 2;
      scene.add(torus);

      // 轴辅助器  3表示轴的长度
      const axisHelper = new THREE.AxesHelper(3);
      // 把轴辅助器添加到场景中
      scene.add(axisHelper);

      scene.add(newGemothree);

      //光源辅助器 每种光源都有对应的辅助器类
      // 参数：0.2表示辅助器的大小
      const lightHelper = new THREE.PointLightHelper(pointLight, 0.2);
      scene.add(lightHelper);
      const spotLightHelper = new THREE.SpotLightHelper(spotLight);
      scene.add(spotLightHelper);
      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });

      window.addEventListener("resize", () => {
        // 1. 更新宽高
        innerWidth = window.innerWidth;
        innerHeight = window.innerHeight;

        // 2. 更新相机的宽高比
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix(); // ✅ 必须调用

        // 3. 更新渲染器尺寸
        renderer.setSize(innerWidth, innerHeight);
        // requestFullscreen();
        // 4. （WebGPU 推荐）设置像素比，防止模糊
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });

      gui.add(ambientLight, "intensity", 0, 1, 0.01).name("环境光强度");
      gui.add(pointLight, "intensity", 0, 100, 1).name("点光强度");
    </script>
  </body>
</html>
